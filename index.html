<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타과 의뢰 환자 명단</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0eeea;
    --border: #dddbd5;
    --border2: #c8c6c0;
    --text: #1a1917;
    --text2: #6b6965;
    --text3: #9b9994;
    --accent: #1a6b3c;
    --accent-bg: #e8f5ee;
    --warn: #92600a;
    --warn-bg: #fef3dc;
    --danger: #9b1c1c;
    --danger-bg: #fde8e8;
    --yellow-hl: #fffbcc;
    --yellow-text: #7a6400;
    --mono: 'Courier New', monospace;
  }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  header .sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .stat-num { font-size: 24px; font-weight: 600; }
  .stat-num.total { color: var(--text); }
  .stat-num.still { color: var(--warn); }
  .stat-num.not-yet { color: var(--danger); }
  .stat-num.done { color: var(--accent); }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type=text] {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px 8px 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    position: relative;
  }
  .toolbar input[type=text]:focus { border-color: var(--accent); }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }
  .toolbar select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .toolbar select:focus { border-color: var(--accent); }
  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #155c33; }
  .tbl-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px; }
  thead th {
    background: var(--surface2);
    color: var(--text2);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 57px;
    z-index: 10;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  tbody td { padding: 9px 12px; vertical-align: top; color: var(--text); }
  .date-cell { white-space: nowrap; color: var(--text2); font-size: 12px; }
  .reg-cell { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .reg-active { color: var(--yellow-text); background: var(--yellow-hl); padding: 2px 6px; border-radius: 5px; font-weight: 700; }
  .result-cell { white-space: pre-wrap; line-height: 1.5; max-width: 280px; font-size: 12.5px; }
  .issue-cell { max-width: 140px; white-space: pre-wrap; font-size: 12.5px; }
  .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge-still { background: var(--warn-bg); color: var(--warn); }
  .badge-end { background: var(--accent-bg); color: var(--accent); }
  .badge-not { background: var(--danger-bg); color: var(--danger); }
  .note-cell { font-size: 12px; color: var(--text3); }
  .action-btns { display: flex; gap: 4px; margin-top: 4px; }
  .act-btn {
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--text2);
    font-family: inherit;
    transition: all 0.1s;
  }
  .act-btn:hover { background: var(--surface2); }
  .act-btn.del:hover { background: var(--danger-bg); color: var(--danger); border-color: #f5c1c1; }
  .act-btn.edit:hover { background: var(--accent-bg); color: var(--accent); border-color: #a7d9bc; }
  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 22px 24px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-row label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    outline: none;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row textarea { resize: vertical; min-height: 72px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: 1; }
    header { padding: 12px 16px; }
    .main { padding: 12px 10px 60px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>타과 의뢰 환자 명단</h1>
    <div class="sub" id="header-sub">데이터 로딩 중...</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn" onclick="exportCSV()">📥 CSV 내보내기</button>
    <button class="btn primary" onclick="openModal()">+ 새 환자 추가</button>
  </div>
</header>

<div class="main">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="환자명, 병록번호, 건진이상, 결과 검색...">
    </div>
    <select id="filter-status">
      <option value="">전체 상태</option>
      <option value="still f/u">still f/u</option>
      <option value="end">end</option>
      <option value="not yet">not yet</option>
    </select>
  </div>

  <div class="tbl-container">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:90px">의뢰일</th>
            <th style="width:88px">병록번호</th>
            <th style="width:62px">성명</th>
            <th style="width:140px">건진이상</th>
            <th>결과</th>
            <th style="width:82px">추적여부</th>
            <th style="width:100px">비고</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">새 환자 추가</h3>
    <div class="form-grid">
      <div class="form-row">
        <label>의뢰일</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-row">
        <label>병록번호</label>
        <input type="text" id="f-reg" placeholder="00000000">
      </div>
      <div class="form-row">
        <label>성명</label>
        <input type="text" id="f-name">
      </div>
      <div class="form-row">
        <label>추적여부</label>
        <select id="f-status">
          <option value="not yet">not yet</option>
          <option value="still f/u">still f/u</option>
          <option value="end">end</option>
        </select>
      </div>
      <div class="form-row full">
        <label>건진이상</label>
        <input type="text" id="f-issue">
      </div>
      <div class="form-row full">
        <label>결과</label>
        <textarea id="f-result"></textarea>
      </div>
      <div class="form-row full">
        <label>비고</label>
        <input type="text" id="f-note">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveRow()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'referral_v2';
const DEFAULT = [
  {id:1,date:'2025-11-11',reg:'01751470',name:'전준호',issue:'Palpitation',result:'r/o Atrial Flutter\n-> Cordarone, NOAC, PPI',status:'still f/u',note:'내 외래도 f/u중'},
  {id:2,date:'2025-12-03',reg:'03714542',name:'박향순',issue:'빈혈, Protein증가',result:'Protein, total 증가\n-> MM 의심\n-> 성서혈종의뢰',status:'end',note:''},
  {id:3,date:'2025-12-15',reg:'01829843',name:'정창용',issue:'빈혈',result:'Pyridoxine(B6), 엽산\n-> 2개월 약 복용 후 d/c',status:'end',note:''},
  {id:4,date:'2026-01-14',reg:'03719884',name:'박춘화',issue:'심비대',result:'TMT, ABP, Echo, holter\n-> Cardiac CT(coronary a. CT)\n-> r/o Myocardial bridge with mild luminal narrowing in mLAD ; No med.',status:'end',note:''},
  {id:5,date:'2026-01-28',reg:'01655933',name:'최외남',issue:'HCV(+)',result:'HCV RNA 정량검사\n-> 음성으로 추적 종료',status:'end',note:''},
  {id:6,date:'2026-02-04',reg:'02429728',name:'권기환',issue:'흡연자, Hb증가',result:'금연 및 Hb f/u',status:'still f/u',note:''},
  {id:7,date:'2026-02-04',reg:'02429728',name:'권기환',issue:'심비대',result:'ABPM, TTE\n-> Statin, HTN med 시작',status:'still f/u',note:''},
  {id:8,date:'2026-02-04',reg:'02429728',name:'권기환',issue:'hyper K',result:'Florinef (에디슨병 치료제인 스테로이드제제) 처방',status:'still f/u',note:''},
  {id:9,date:'2026-02-09',reg:'02331185',name:'최종순',issue:'G.varix, 간수치증가',result:'r/o LC 로 abd. CT, lab f/u\n-> gastric SET 소견',status:'end',note:''},
  {id:10,date:'2026-03-25',reg:'02925331',name:'이상원',issue:'건진 폐암 의심',result:'r/o lung ca.로 절대 금연하며 3개월뒤 ct f/u',status:'still f/u',note:''},
  {id:11,date:'2026-04-03',reg:'01835895',name:'이혜영',issue:'심한 심장 석회화',result:'심장초음파(TTE), CCTA\n-> pitava2mg/에제티미브 복약중이었는데\nLDL <70 타겟으로 pitava 2mg 더 추가',status:'still f/u',note:''},
  {id:12,date:'2026-04-03',reg:'01662703',name:'나규식',issue:'TG 증가',result:'apo B 포함검사',status:'not yet',note:''},
  {id:13,date:'2026-04-08',reg:'01891234',name:'신지혜',issue:'총장님 며느리\nLDL 160, 폐경 및 골다공증',result:'성서 정형외과 다니고 있어서 골다공증 진료 및 갱년기 증상 부인과 의뢰\n-> Angeliq 3개월 테스트',status:'still f/u',note:''},
  {id:14,date:'2026-04-24',reg:'03338645',name:'이인상',issue:'TG 800',result:'1개월 뒤 lab f/u, 1개월 뒤 fenofibrate',status:'still f/u',note:''},
  {id:15,date:'2026-04-27',reg:'02473007',name:'최정현',issue:'간헐관종,\nProtein 증가, 알부민 증가',result:'성서 소화기 원함',status:'not yet',note:''},
  {id:16,date:'2026-04-27',reg:'03116399',name:'노복우',issue:'심장석회화 경도\nbut DOE',result:'심초음파, CCTA w/u',status:'still f/u',note:''},
  {id:17,date:'2026-04-29',reg:'02322765',name:'손곡수',issue:'콜레스테롤 좋으나\nb-MRA 상 심한 협착',result:'statin low dose, 27년4월 CTA (carotid 까지) w/u',status:'still f/u',note:''},
  {id:18,date:'2026-05-06',reg:'03733845',name:'김경환',issue:'Cr 증가',result:'ADPKD로 성서 신장내과로 의뢰',status:'still f/u',note:''},
  {id:19,date:'2026-05-08',reg:'03277754',name:'연동녕',issue:'pancytopenia',result:'early HCC 의심',status:'still f/u',note:''},
  {id:20,date:'2026-05-15',reg:'03741586',name:'안길영',issue:'proteinuria',result:'2개월 뒤 U/A f/u',status:'still f/u',note:''},
  {id:21,date:'2026-05-20',reg:'03235453',name:'김상호',issue:'숨참(과거 결핵)',result:'ILD 산정특례 받고, 항섬유화 제제 복용 시작',status:'still f/u',note:''},
  {id:22,date:'2026-05-22',reg:'02878572',name:'이정길',issue:'CPK 증가',result:'',status:'not yet',note:''},
];

let data = [], nextId = 200, editingId = null;

function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { data = JSON.parse(s); nextId = Math.max(...data.map(r=>r.id)) + 1; return; }
  } catch(e){}
  data = JSON.parse(JSON.stringify(DEFAULT));
  nextId = 200;
  save();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
}

function badge(s) {
  if (s==='still f/u') return `<span class="badge badge-still">still f/u</span>`;
  if (s==='end') return `<span class="badge badge-end">end</span>`;
  return `<span class="badge badge-not">not yet</span>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('filter-status').value;
  const rows = data.filter(r => {
    const m = !q || [r.name,r.reg,r.issue,r.result,r.note].join(' ').toLowerCase().includes(q);
    const ms = !sf || r.status === sf;
    return m && ms;
  });

  const total = data.length;
  const still = data.filter(r=>r.status==='still f/u').length;
  const notYet = data.filter(r=>r.status==='not yet').length;
  const done = data.filter(r=>r.status==='end').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">전체</div><div class="stat-num total">${total}</div></div>
    <div class="stat"><div class="stat-label">추적 중</div><div class="stat-num still">${still}</div></div>
    <div class="stat"><div class="stat-label">미확인</div><div class="stat-num not-yet">${notYet}</div></div>
    <div class="stat"><div class="stat-label">종료</div><div class="stat-num done">${done}</div></div>
  `;
  document.getElementById('header-sub').textContent = `총 ${total}명 · 최근 업데이트 ${new Date().toLocaleDateString('ko-KR')}`;

  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">검색 결과가 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const isActive = r.status === 'still f/u';
    const regHtml = isActive
      ? `<span class="reg-active">${esc(r.reg)}</span>`
      : `<span style="color:var(--text2)">${esc(r.reg)}</span>`;
    return `<tr>
      <td class="date-cell">${esc(r.date)}</td>
      <td class="reg-cell">${regHtml}</td>
      <td><strong>${esc(r.name)}</strong></td>
      <td class="issue-cell">${esc(r.issue)}</td>
      <td class="result-cell">${esc(r.result)}</td>
      <td>${badge(r.status)}</td>
      <td>
        <div class="note-cell">${esc(r.note)}</div>
        <div class="action-btns">
          <button class="act-btn edit" onclick="editRow(${r.id})">수정</button>
          <button class="act-btn del" onclick="delRow(${r.id})">삭제</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openModal(pre) {
  editingId = null;
  document.getElementById('modal-title').textContent = '새 환자 추가';
  document.getElementById('f-date').value = pre?.date || new Date().toISOString().slice(0,10);
  document.getElementById('f-reg').value = pre?.reg || '';
  document.getElementById('f-name').value = pre?.name || '';
  document.getElementById('f-issue').value = pre?.issue || '';
  document.getElementById('f-result').value = pre?.result || '';
  document.getElementById('f-status').value = pre?.status || 'not yet';
  document.getElementById('f-note').value = pre?.note || '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(), 50);
}

function editRow(id) {
  const r = data.find(x=>x.id===id);
  if (!r) return;
  editingId = id;
  document.getElementById('modal-title').textContent = '환자 정보 수정';
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-reg').value = r.reg;
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-issue').value = r.issue;
  document.getElementById('f-result').value = r.result;
  document.getElementById('f-status').value = r.status;
  document.getElementById('f-note').value = r.note||'';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function saveRow() {
  const d = {
    date: document.getElementById('f-date').value,
    reg: document.getElementById('f-reg').value.trim(),
    name: document.getElementById('f-name').value.trim(),
    issue: document.getElementById('f-issue').value.trim(),
    result: document.getElementById('f-result').value.trim(),
    status: document.getElementById('f-status').value,
    note: document.getElementById('f-note').value.trim(),
  };
  if (!d.name || !d.date) { toast('날짜와 성명은 필수입니다.', true); return; }
  if (editingId !== null) {
    const idx = data.findIndex(x=>x.id===editingId);
    if (idx > -1) data[idx] = { ...data[idx], ...d };
    toast('수정되었습니다.');
  } else {
    data.push({ id: nextId++, ...d });
    toast('추가되었습니다.');
  }
  save();
  closeModal();
  render();
}

function delRow(id) {
  const r = data.find(x=>x.id===id);
  if (!r || !confirm(`${r.name} 환자를 삭제하시겠습니까?`)) return;
  data = data.filter(x=>x.id!==id);
  save();
  render();
  toast('삭제되었습니다.');
}

function exportCSV() {
  const header = ['의뢰일','병록번호','성명','건진이상','결과','추적여부','비고'];
  const rows = data.map(r => [r.date,r.reg,r.name,r.issue,r.result,r.status,r.note]
    .map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + [header.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `타과의뢰_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

let toastTimer;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? 'var(--danger)' : '#1a1917';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-status').addEventListener('change', render);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

load();
render();
</script>
</body>
</html>
