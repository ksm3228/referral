<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>타과 의뢰 환자 명단</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0eeea;
    --border: #dddbd5; --border2: #c8c6c0; --text: #1a1917;
    --text2: #6b6965; --text3: #9b9994; --accent: #1a6b3c;
    --accent-bg: #e8f5ee; --warn: #92600a; --warn-bg: #fef3dc;
    --danger: #9b1c1c; --danger-bg: #fde8e8;
    --yellow-hl: #fffbcc; --yellow-text: #7a6400;
    --mono: 'Courier New', monospace;
  }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
  .login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
  .google-btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer; width: 100%; justify-content: center; transition: background 0.15s; font-family: inherit; }
  .google-btn:hover { background: var(--surface2); }
  .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .login-error { margin-top: 14px; font-size: 12px; color: var(--danger); display: none; }
  #app-screen { display: none; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .hospital-emoji { font-size: 20px; line-height: 1; }
  header h1 { font-size: 16px; font-weight: 700; color: #1a1917; white-space: nowrap; margin: 0; }
  .header-date { font-size: 13px; color: #55534f; font-weight: 500; margin-left: 4px; white-space: nowrap; }
  .version-badge { font-size: 11px; color: #8c8a85; background: #f0eeea; border: 1px solid #dcdad4; border-radius: 6px; padding: 1px 6px; cursor: pointer; font-family: var(--mono); line-height: 1.2; }
  .version-badge:hover { border-color: var(--border2); color: var(--text2); }
  .user-info { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .user-avatar { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1px solid var(--border); }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-email { font-size: 12px; color: var(--text2); }
  .logout-btn { padding: 4px 10px; border-radius: 8px; border: 1px solid #dddbd5; background: #fff; font-size: 12px; color: #6b6965; cursor: pointer; font-family: inherit; }
  .logout-btn:hover { background: var(--surface2); }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .stats { display: flex; gap: 6px; padding: 10px 12px; width: 100%; background: var(--bg); border-bottom: 1px solid var(--border); }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; flex: 1; min-width: 0; text-align: center; }
  .stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 2px; white-space: nowrap; }
  .stat-num { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .stat-num.total { color: var(--text); }
  .stat-num.still { color: var(--warn); }
  .stat-num.not-yet { color: var(--danger); }
  .stat-num.done { color: var(--accent); }
  .toolbar { display: flex; gap: 10px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }
  .toolbar input[type=text] { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text); outline: none; font-family: inherit; }
  .toolbar input[type=text]:focus { border-color: var(--accent); }
  .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text); outline: none; cursor: pointer; font-family: inherit; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-family: inherit; transition: background 0.15s; }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #155c33; }
  .tbl-container { background: var(--surface); border-top: 1px solid var(--border); }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: var(--surface2); color: var(--text2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  tbody td { padding: 9px 12px; vertical-align: top; color: var(--text); }
  .date-cell { white-space: nowrap; color: var(--text2); font-size: 12px; }
  .reg-cell { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .reg-active { color: var(--yellow-text); background: var(--yellow-hl); padding: 2px 6px; border-radius: 5px; font-weight: 700; }
  .result-cell { white-space: pre-wrap; line-height: 1.5; max-width: 280px; font-size: 12.5px; }
  .issue-cell { max-width: 140px; white-space: pre-wrap; font-size: 12.5px; }
  .note-cell { font-size: 12px; color: var(--text3); }
  .action-btns { display: flex; gap: 8px; margin-top: 6px; }
  .act-btn { padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); background: none; cursor: pointer; font-size: 11px; color: var(--text2); font-family: inherit; transition: all 0.1s; }
  .act-btn:hover { background: var(--surface2); }
  .act-btn.del:hover { background: var(--danger-bg); color: var(--danger); border-color: #f5c1c1; }
  .act-btn.edit:hover { background: var(--accent-bg); color: var(--accent); border-color: #a7d9bc; }
  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
  .status-select { font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 20px; border: none; cursor: pointer; outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; text-align: center; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--border); padding: 22px 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-row label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .form-row input, .form-row textarea, .form-row select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; background: var(--surface); color: var(--text); font-family: inherit; outline: none; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row textarea { resize: vertical; min-height: 72px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .changelog-list { max-height: 260px; overflow-y: auto; margin-bottom: 14px; }
  .changelog-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: flex-start; }
  .changelog-item:last-child { border-bottom: none; }
  .changelog-ver { font-family: var(--mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; white-space: nowrap; color: var(--text2); min-width: 48px; text-align: center; }
  .changelog-date { font-size: 11px; color: var(--text3); white-space: nowrap; }
  .changelog-note { flex: 1; color: var(--text); }
  .changelog-empty { text-align: center; color: var(--text3); font-size: 13px; padding: 20px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all 0.25s; z-index: 300; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 680px) {
    header { padding: 10px 12px; }
    .user-email { display: none; }
    header h1 { font-size: 15px; }
    .stat-label { font-size: 10px; }
    .stat-num { font-size: 18px; }
  }
</style>
</head>

  {date:'2026-05-08',reg:'03277754',name:'연동녕',issue:'pancytopenia',result:'early HCC 의심',status:'still f/u',note:''},
  {date:'2026-05-15',reg:'03741586',name:'안길영',issue:'proteinuria',result:'2개월 뒤 U/A f/u',status:'still f/u',note:''},
  {date:'2026-05-20',reg:'03235453',name:'김상호',issue:'숨참(과거 결핵)',result:'ILD 산정특례 받고, 항섬유화 제제 복용 시작',status:'still f/u',note:''},
  {date:'2026-05-22',reg:'02878572',name:'이정길',issue:'CPK 증가',result:'',status:'not yet',note:''},
];
let allData = [], editingKey = null;
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function statusStyle(s) {
  if (s==='still f/u') return 'background:var(--warn-bg);color:var(--warn)';
  if (s==='end') return 'background:var(--accent-bg);color:var(--accent)';
  return 'background:var(--danger-bg);color:var(--danger)';
}
function showToast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = err ? 'var(--danger)' : '#1a1917';
  el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200);
}
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('filter-status').value;
  const rows = allData.filter(r => {
    const m = !q || [r.name,r.reg,r.issue,r.result,r.note].join(' ').toLowerCase().includes(q);
    return m && (!sf || r.status === sf);
  });
  document.getElementById('s-total').textContent = allData.length;
  document.getElementById('s-still').textContent = allData.filter(r=>r.status==='still f/u').length;
  document.getElementById('s-notyet').textContent = allData.filter(r=>r.status==='not yet').length;
  document.getElementById('s-done').textContent = allData.filter(r=>r.status==='end').length;
  const today = new Date();
  document.getElementById('header-sub').textContent = `${today.getMonth()+1}/${today.getDate()} (${['일','월','화','수','목','금','토'][today.getDay()]})`;
  const tbody = document.getElementById('tbody');
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="7" class="empty">검색 결과가 없습니다.</td></tr>`; return; }
  tbody.innerHTML = rows.map(r => {
    const isActive = r.status === 'still f/u';
    const isNotYet = r.status === 'not yet';
    const isEnd = r.status === 'end';
    const rowStyle = isEnd ? 'background:#f5f5f5;opacity:0.7;' : isNotYet ? 'background:#fff5f5;' : '';
    const regHtml = isActive
      ? `<span class="reg-active">${esc(r.reg)}</span>`
      : isNotYet
      ? `<span style="color:var(--danger);background:var(--danger-bg);padding:2px 6px;border-radius:5px;font-weight:700;font-family:var(--mono);font-size:12px">${esc(r.reg)}</span>`
      : `<span style="color:var(--text2)">${esc(r.reg)}</span>`;
    return `<tr style="${rowStyle}">
      <td class="date-cell">${esc(r.date)}</td>
      <td class="reg-cell">${regHtml}</td>
      <td style="white-space:nowrap"><strong>${esc(r.name)}</strong></td>
      <td class="issue-cell">${esc(r.issue)}</td>
      <td class="result-cell">${esc(r.result)}</td>
      <td>
        <select class="status-select" data-key="${r._key}" style="${statusStyle(r.status)}">
          <option value="still f/u" ${r.status==='still f/u'?'selected':''}>still f/u</option>
          <option value="end" ${r.status==='end'?'selected':''}>end</option>
          <option value="not yet" ${r.status==='not yet'?'selected':''}>not yet</option>
        </select>
      </td>
      <td><div class="note-cell">${esc(r.note)}</div>
        <div class="action-btns">
          <button class="act-btn edit" data-key="${r._key}">수정</button>
          <button class="act-btn del" data-key="${r._key}">삭제</button>
        </div></td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('.act-btn.edit').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.key)));
  tbody.querySelectorAll('.act-btn.del').forEach(btn => btn.addEventListener('click', () => deleteRow(btn.dataset.key)));
  tbody.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const key = sel.dataset.key;
      const r = allData.find(x => x._key === key); if (!r) return;
      const newStatus = sel.value;
      const { _key, ...data } = r;
      await set(ref(db, `referral/${key}`), { ...data, status: newStatus });
      // 버전 자동 0.1 올림
      const versions = await loadVersions();
      let nextVer = 'v1.0';
      if (versions[0]) {
        const parts = versions[0].ver.replace('v','').split('.');
        parts[parts.length-1] = String(Number(parts[parts.length-1]||0) + 1);
        nextVer = 'v' + parts.join('.');
      }
      await push(ref(db, 'changelog'), { ver: nextVer, note: `${r.name} 상태 변경 → ${newStatus}`, ts: Date.now() });
      initVersionBadge();
      showToast(`${r.name} → ${newStatus}`);
    });
  });
}
function openAddModal() {
  editingKey = null;
  document.getElementById('modal-title').textContent = '새 환자 추가';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  ['f-reg','f-name','f-issue','f-result','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'not yet';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}
function openEditModal(key) {
  const r = allData.find(x => x._key === key); if (!r) return;
  editingKey = key;
  document.getElementById('modal-title').textContent = '환자 정보 수정';
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-reg').value = r.reg;
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-issue').value = r.issue;
  document.getElementById('f-result').value = r.result;
  document.getElementById('f-status').value = r.status;
  document.getElementById('f-note').value = r.note || '';
  document.getElementById('modal-overlay').classList.add('open');
}
async function saveRow() {
  const d = {
    date: document.getElementById('f-date').value,
    reg: document.getElementById('f-reg').value.trim(),
    name: document.getElementById('f-name').value.trim(),
    issue: document.getElementById('f-issue').value.trim(),
    result: document.getElementById('f-result').value.trim(),
    status: document.getElementById('f-status').value,
    note: document.getElementById('f-note').value.trim(),
  };
  if (!d.name || !d.date) { showToast('날짜와 성명은 필수입니다.', true); return; }
  try {
    if (editingKey) { await set(ref(db, `referral/${editingKey}`), d); showToast('수정되었습니다.'); }
    else { await push(ref(db, 'referral'), d); showToast('추가되었습니다.'); }
    document.getElementById('modal-overlay').classList.remove('open');
  } catch(e) { showToast('저장 중 오류가 발생했습니다.', true); }
}
async function deleteRow(key) {
  const r = allData.find(x => x._key === key);
  if (!r || !confirm(`${r.name} 환자를 삭제하시겠습니까?`)) return;
  try { await remove(ref(db, `referral/${key}`)); showToast('삭제되었습니다.'); }
  catch(e) { showToast('삭제 중 오류가 발생했습니다.', true); }
}
async function loadVersions() {
  const snap = await get(ref(db, 'changelog')); const versions = [];
  if (snap.exists()) { snap.forEach(child => versions.push({ _key: child.key, ...child.val() })); versions.sort((a,b) => b.ts - a.ts); }
  return versions;
}
async function initVersionBadge() {
  const versions = await loadVersions();
  if (versions[0]) document.getElementById('version-badge').textContent = versions[0].ver;
}
async function openVersionModal() {
  document.getElementById('version-modal').classList.add('open');
  const versions = await loadVersions(); renderChangelog(versions);
  if (versions[0]) { const parts = versions[0].ver.replace('v','').split('.'); parts[parts.length-1] = String(Number(parts[parts.length-1]||0)+1); document.getElementById('v-ver').value = 'v' + parts.join('.'); }
  else { document.getElementById('v-ver').value = 'v1.0'; }
}
function renderChangelog(versions) {
  const el = document.getElementById('changelog-list');
  if (!versions.length) { el.innerHTML = `<div class="changelog-empty">변경 이력이 없습니다.</div>`; return; }
  el.innerHTML = versions.map(v => `<div class="changelog-item"><span class="changelog-ver">${esc(v.ver)}</span><span class="changelog-date">${new Date(v.ts).toLocaleDateString('ko-KR')}</span><span class="changelog-note">${esc(v.note)}</span><button class="act-btn del" data-vkey="${v._key}">삭제</button></div>`).join('');
  if (versions[0]) document.getElementById('version-badge').textContent = versions[0].ver;
  el.querySelectorAll('.act-btn.del').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('이 버전 기록을 삭제하시겠습니까?')) return;
    await remove(ref(db, `changelog/${btn.dataset.vkey}`));
    renderChangelog(await loadVersions()); showToast('삭제되었습니다.');
  }));
}
async function addVersion() {
  const ver = document.getElementById('v-ver').value.trim(), note = document.getElementById('v-note').value.trim();
  if (!ver || !note) { showToast('버전과 내용을 입력해주세요.', true); return; }
  await push(ref(db, 'changelog'), { ver, note, ts: Date.now() });
  document.getElementById('v-note').value = ''; renderChangelog(await loadVersions()); showToast('버전이 기록되었습니다.');
}
onAuthStateChanged(auth, async (user) => {
  if (user) {
    if (user.email !== ALLOWED_EMAIL) {
      await fbSignOut(auth);
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('login-error').textContent = `접근 권한이 없는 계정입니다. (${user.email})`;
      return;
    }
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('user-photo').src = user.photoURL || '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    onValue(ref(db, 'referral'), (snap) => {
      allData = [];
      if (snap.exists()) {
        snap.forEach(child => allData.push({ _key: child.key, ...child.val() }));
        allData.sort((a,b) => b.date > a.date ? 1 : -1);
      } else {
        DEFAULT_DATA.forEach(row => push(ref(db, 'referral'), row));
      }
      console.log('데이터 실시간 로드 완료:', allData.length, '개');
      render();
    });
    initVersionBadge();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});
document.getElementById('google-login-btn').addEventListener('click', async () => {
  try { document.getElementById('login-error').style.display = 'none'; await signInWithPopup(auth, provider); }
  catch(e) { document.getElementById('login-error').style.display = 'block'; document.getElementById('login-error').textContent = '로그인 중 오류가 발생했습니다.'; }
});
document.getElementById('logout-btn').addEventListener('click', () => fbSignOut(auth));
document.getElementById('add-btn').addEventListener('click', openAddModal);
document.getElementById('version-badge').addEventListener('click', openVersionModal);
document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal-overlay').classList.remove('open'));
document.getElementById('modal-save').addEventListener('click', saveRow);
document.getElementById('version-close').addEventListener('click', () => document.getElementById('version-modal').classList.remove('open'));
document.getElementById('v-add-btn').addEventListener('click', addVersion);
document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-status').addEventListener('change', render);
document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) document.getElementById('modal-overlay').classList.remove('open'); });
document.getElementById('version-modal').addEventListener('click', e => { if(e.target===e.currentTarget) document.getElementById('version-modal').classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') { document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('version-modal').classList.remove('open'); }});
</script>
</body>
